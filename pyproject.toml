[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecoflow-reader"
version = "0.1.7"
description = "Librería en Python para interactuar con la API pública de EcoFlow."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0"}
authors = [
    {name = "Jesus Palencia", email = "sinfallas@gmail.com"}
]
dependencies = [
    "requests",
    "python-dotenv",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/sinfallas/ecoflow_reader"
Repository = "https://github.com/sinfallas/ecoflow_reader.git"

[project.scripts]
ecoflow-cli = "ecoflow_reader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "tox",
    "tox-uv",
    "ruff"
]

[tool.pytest.ini_options]
addopts = "--cov=ecoflow_reader --cov-report=term-missing"
markers = [
    "integration: marca pruebas que hacen peticiones reales a la API de EcoFlow"
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
# Longitud máxima de línea (120 es ideal para evitar cortes bruscos en descripciones de Pydantic)
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle (estilo), F: Pyflakes (errores lógicos), I: isort (orden automático de imports)
select = ["E", "F", "I"]
